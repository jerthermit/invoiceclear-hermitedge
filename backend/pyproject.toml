[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceclear"
version = "0.1.0"
description = "Review purchase-order evidence and prepare supported invoice resolutions."
requires-python = ">=3.11"
dependencies = ["pypdf==6.20.1", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
include = ["invoiceclear*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
